name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install GJS and GLib tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gjs libglib2.0-bin zip

      - run: npm ci
      - run: make lint
      - run: make test
      - run: make i18n-check
      - run: make zip

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/*.zip
